name: Build
on: push

jobs:
  run:
    name: Build README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
